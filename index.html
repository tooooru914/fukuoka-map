    const mk = markers[s.id];
    if (!mk) continue;
    if (active.has(s.genre)) { if (!map.hasLayer(mk)) mk.addTo(map); }
    else if (map.hasLayer(mk)) map.removeLayer(mk);
  }
  document.querySelectorAll("section.genre").forEach(sec => sec.classList.toggle("hidden", !active.has(sec.dataset.g)));
  document.querySelectorAll(".chip[data-g]").forEach(c => c.classList.toggle("off", !active.has(c.dataset.g)));
  const hs = active.size === ORDER.length ? "" : "g=" + [...active].join(",");
  history.replaceState(null, "", hs ? "#"+hs : location.pathname + location.search);
  if (fit) {
    const vs = visibleStores();
    if (vs.length) map.fitBounds(L.latLngBounds(vs.map(s=>[s.lat,s.lng])).pad(0.15));
  }
}

const chips = document.getElementById("chips");
for (const k of ORDER) {
  const g = GENRES[k];
  const c = document.createElement("button");
  c.className = "chip"; c.dataset.g = k;
  c.innerHTML = `<span class="dot" style="background:${g.color}"></span>${g.emoji} ${g.label}`;
  c.onclick = () => {
    if (active.has(k) && active.size === 1) return;
    active.has(k) ? active.delete(k) : active.add(k);
    refresh(true);
  };
  chips.appendChild(c);
}
const allBtn = document.createElement("button");
allBtn.className = "chip all"; allBtn.textContent = "全表示";
allBtn.onclick = () => { active = new Set(ORDER); refresh(true); };
chips.appendChild(allBtn);

const list = document.getElementById("list");
for (const k of ORDER) {
  const g = GENRES[k];
  const sec = document.createElement("section");
  sec.className = "genre"; sec.dataset.g = k;
  const items = STORES.filter(s => s.genre === k);
  sec.innerHTML = `<div class="ghead"><span class="dot" style="background:${g.color}"></span>${g.emoji} ${g.label} <span class="cnt">${items.length}店</span></div>`;
  for (const s of items) {
    const gm = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.gq || (s.name + " 福岡"));
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="info"><div class="nm">${s.name}</div><div class="meta"><b>★${s.rating.toFixed(1)}</b>（${s.reviews.toLocaleString()}件）・${s.area}</div><div class="bl">${s.blurb}</div></div><a class="gbtn" href="${gm}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Google<br>マップ</a>`;
    card.onclick = () => {
      const mk = markers[s.id];
      if (!mk) return;
      document.getElementById("map").scrollIntoView({behavior:"smooth", block:"start"});
      map.setView([s.lat, s.lng], 16.5);
      mk.openPopup();
    };
    sec.appendChild(card);
  }
  list.appendChild(sec);
}

refresh(true);
</script>
</body>
</html>
